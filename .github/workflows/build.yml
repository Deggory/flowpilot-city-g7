name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build Docker image
      run: |
        ./build_env.sh

    - name: Build apk
      run: |
        ./build.sh full
        test -f android/build/outputs/apk/release/android-release.apk
        # scripts/build.sh swallows scons errors: make sure the native libs made it into the APK inputs
        for lib in messaging pandad modelparser pandaflash thneedrunner usb-1.0 lmdb json11; do test -f android/libs/arm64-v8a/lib$lib.so; done

    - name: Archive apk
      uses: actions/upload-artifact@v4
      with:
        name: android-release.apk
        path: android/build/outputs/apk/release/android-release.apk

    - name: Archive libs
      uses: actions/upload-artifact@v4
      with:
        name: libs
        path: android/libs
